<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131c"><link rel="manifest" href="./manifest.webmanifest"><title>STARR Owner</title><style>

</script></body></html>
